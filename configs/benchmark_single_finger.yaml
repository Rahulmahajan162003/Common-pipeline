# YellowSense UIDAI Contactless Fingerprint Benchmark Configuration
# Single-Finger Full Evaluation Pipeline

benchmark:
  name: single_finger_v1_evaluation
  dataset_version: single_finger_test_v1
  task_type: single_finger_authentication
  random_seed: 42
  description: "YellowSense Single-Finger 2D, 3D, and Flash Liveness Benchmark"

data:
  manifest_path: datasets/manifests/example_manifest.csv
  calibration_split_name: calibration
  test_split_name: test
  check_image_existence: true
  verify_hashes: true
  allow_missing_images: false

evaluation:
  score_direction: higher_is_accept
  threshold_method: target_far
  target_far: 0.001       # Target FAR <= 0.1%
  target_frr: 0.01        # Target FRR <= 1.0%
  treat_error_as_reject: false
  threshold_sweep_steps: 100

latency:
  warmup_runs: 3
  repetitions: 1
  thresholds_ms: [1000.0, 2000.0, 5000.0, 7000.0]

models:
  - name: dualscale_2d
    version: 1.0.0
    adapter: dualscale_2d
    checkpoint_path: checkpoints/dualscale_model.pth
    device: cpu

outputs:
  root: results
  export_plots: true
  generate_html: true
  export_fusion_table: true
  top_k_hard_cases: 15
