# YellowSense UIDAI Contactless Fingerprint Benchmark Configuration
# Single-Finger PAD - PRODUCTION model (ShuffleNetV2), same flow as the app:
# finger detector crop (512, conf 0.10, margins 8% sides / 18% top / 8% bottom)
# -> resize 224 -> one ShuffleNetV2 inference -> live if p_live >= 0.656550407409668

benchmark:
  name: single_finger_production_shufflenet
  dataset_version: pad_v0
  task_type: single_finger_authentication
  random_seed: 42
  description: "Production single-finger PAD (ShuffleNetV2) on pad_v0"

data:
  manifest_path: datasets/manifests/pad_v0/pad_v0_single_finger.csv
  calibration_split_name: calibration
  test_split_name: test
  check_image_existence: true
  verify_hashes: true
  allow_missing_images: false

evaluation:
  score_direction: higher_is_accept
  threshold_method: manual
  manual_threshold: 0.656550407409668   # App production threshold (live_score >= threshold)
  treat_error_as_reject: false
  threshold_sweep_steps: 100

latency:
  warmup_runs: 3
  repetitions: 1
  thresholds_ms: [50.0, 100.0, 250.0, 500.0]

models:
  - name: shufflenet_v2_pad
    version: 1.0.0
    adapter: shufflenet_pad
    checkpoint_path: models/pad_shufflenet_v2_unified.pt
    device: cpu
    extra_params:
      finger_crop: yolo          # 'yolo' (app) | 'none'
      detector_imgsz: 512
      detector_conf: 0.10
      margin_side: 0.08
      margin_top: 0.18
      margin_bottom: 0.08

outputs:
  root: results
  export_plots: true
  generate_html: true
  export_fusion_table: true
  top_k_hard_cases: 15
