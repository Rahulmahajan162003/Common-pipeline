# YellowSense UIDAI Contactless Fingerprint Benchmark Configuration
# Dedicated RTK-PAD Evaluation on pad_v0_slap

benchmark:
  name: rtk_pad_slap_evaluation
  dataset_version: pad_v0
  task_type: slap_4_finger_authentication
  random_seed: 42
  description: "GlobalLocalRTKPAD Slap Presentation Attack Detection on pad_v0"

data:
  manifest_path: datasets/manifests/pad_v0/pad_v0_slap.csv
  calibration_split_name: calibration
  test_split_name: test
  check_image_existence: true
  verify_hashes: true
  allow_missing_images: false

evaluation:
  score_direction: higher_is_accept
  threshold_method: manual
  manual_threshold: 0.50
  target_far: 0.01
  target_frr: 0.05
  treat_error_as_reject: false
  threshold_sweep_steps: 100

latency:
  warmup_runs: 3
  repetitions: 1
  thresholds_ms: [50.0, 100.0, 250.0, 500.0]

models:
  - name: rtk_pad_global_local
    version: 1.0.0
    adapter: rtk_pad
    checkpoint_path: models/pad_rtk_global_local_best.pt
    device: cpu

outputs:
  root: results
  export_plots: true
  generate_html: true
  export_fusion_table: true
  top_k_hard_cases: 15
