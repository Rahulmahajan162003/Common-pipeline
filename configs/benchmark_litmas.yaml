# YellowSense UIDAI Contactless Fingerprint Benchmark Configuration
# Dedicated Evaluation of LitMAS (Lightweight Multi-Modal Anti-Spoofing) Model

benchmark:
  name: litmas_pad_evaluation
  dataset_version: multidevice_pad_v1
  task_type: single_finger_authentication
  random_seed: 42
  description: "Dedicated benchmark of LitMAS Vision Transformer Model on Multi-Device PAD dataset"

data:
  manifest_path: datasets/manifests/multidevice_pad_manifest.csv
  calibration_split_name: calibration
  test_split_name: test
  check_image_existence: true
  verify_hashes: true
  allow_missing_images: false

evaluation:
  score_direction: higher_is_accept
  threshold_method: target_far
  target_far: 0.01       # Target FAR <= 1.0%
  target_frr: 0.05       # Target FRR <= 5.0%
  treat_error_as_reject: false
  threshold_sweep_steps: 100

latency:
  warmup_runs: 3
  repetitions: 1
  thresholds_ms: [50.0, 100.0, 250.0, 500.0]

models:
  - name: litmas_moe_model
    version: 1.0.0
    adapter: litmas
    checkpoint_path: D:\LitMAS-main\LitMAS-main\checkpoints_colfispoof\litmas_colfispoof_best.pth
    device: cpu

outputs:
  root: results
  export_plots: true
  generate_html: true
  export_fusion_table: false
  top_k_hard_cases: 15
