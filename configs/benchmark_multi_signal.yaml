# Multi-Signal Benchmark Configuration
# Evaluates DualScale 2D, 3D, and Flash Liveness together and exports aligned fusion table

benchmark:
  name: multi_signal_evaluation
  dataset_version: single_finger_test_v1
  task_type: single_finger_authentication
  random_seed: 42
  description: "Benchmarking DualScale 2D, 3D Model, and Flash Liveness"

data:
  manifest_path: datasets/manifests/example_manifest.csv
  calibration_split_name: calibration
  test_split_name: test
  check_image_existence: true
  verify_hashes: true

evaluation:
  score_direction: higher_is_accept
  threshold_method: target_far
  target_far: 0.001
  treat_error_as_reject: false

latency:
  warmup_runs: 2
  repetitions: 1
  thresholds_ms: [1000.0, 2000.0, 5000.0, 7000.0]

models:
  - name: dualscale_2d
    version: 1.0.0
    adapter: dualscale_2d

  - name: model_3d
    version: 1.0.0
    adapter: model_3d

  - name: flash_liveness
    version: 1.0.0
    adapter: flash_liveness

outputs:
  root: results
  export_plots: true
  generate_html: true
  export_fusion_table: true
  top_k_hard_cases: 15
